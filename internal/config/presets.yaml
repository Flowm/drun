services:
  aws:
    image: amazon/aws-cli:2.34.63@sha256:c95ab0642137f55a12b95b6956dd03cefdbd73e760e0e7b870afc9b47f9c8150
    volumes:
      - ~/.aws:/root/.aws
    user: default

  claude:
    image: node:26-alpine@sha256:144769ec3f32e8ee36b3cfde91e82bee25d9367b20f31a151f3f7eea3a2a8541
    entrypoint: claude
    environment:
      HOME: /home/user
      SHELL: /bin/bash
    volumes:
      - ~/.claude:/home/user/.claude
      - ~/.claude.json:/home/user/.claude.json
      - ~/.gitconfig:/home/user/.gitconfig:ro
    x-drun-layer:
      apk:
        - bash
        - curl
        - git
        - git-lfs
        - go
        - make
        - nodejs
        - npm
        - python3
        - uv
      npm: ['@anthropic-ai/claude-code']

  codex:
    image: node:26-alpine@sha256:144769ec3f32e8ee36b3cfde91e82bee25d9367b20f31a151f3f7eea3a2a8541
    entrypoint: codex
    environment:
      HOME: /home/user
    volumes:
      - ~/.codex:/home/user/.codex
      - ~/.gitconfig:/home/user/.gitconfig:ro
    x-drun-layer:
      apk:
        - bash
        - curl
        - git
        - git-lfs
        - go
        - make
        - nodejs
        - npm
        - python3
        - uv
      npm: ['@openai/codex']

  dive:
    image: wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10
    user: default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  gdal:
    image: ghcr.io/osgeo/gdal:alpine-small-3.6.3@sha256:5acba2cc589839090cfe5e90a990c6383c883a3507102bcd8f9a842891a6f672

  go:
    image: golang:1.26-alpine@sha256:f23e8b227fb4493eabe03bede4d5a32d04092da71962f1fb79b5f7d1e6c2a17f
    environment:
      GOPATH: /cwd/.go
      GOCACHE: /cwd/.go/cache

  jq:
    image: alpine:3.23@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    x-drun-layer:
      apk: [jq]

  mc:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    volumes:
      - ~/.mc:/.mc

  mitmproxy:
    image: mitmproxy/mitmproxy:12.2.3@sha256:00b77b5d8804c8ad18cb6caefbf9d5849e895e8986c5ce011f4ae30f4385962f
    entrypoint: mitmweb
    command: [--web-host, 0.0.0.0]
    ports: [2080:8080, 127.0.0.1:2081:8081]
    volumes:
      - ~/.mitmproxy:/home/mitmproxy/.mitmproxy
    user: default

  mtr:
    image: alpine:3.23@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    entrypoint: mtr
    x-drun-layer:
      apk: [mtr]

  node:
    image: node:26-alpine@sha256:144769ec3f32e8ee36b3cfde91e82bee25d9367b20f31a151f3f7eea3a2a8541

  opencode:
    image: ghcr.io/anomalyco/opencode:1.16.2@sha256:873c8572e4b28c299e56062a321aa968af815d708ce03906aae25ad5c3f8036e
    environment:
      HOME: /home/user
    volumes:
      - ~/.agents/skills:/home/user/.agents/skills
      - ~/.config/opencode:/home/user/.config/opencode
      - ~/.local/share/opencode:/home/user/.local/share/opencode
      - ~/.local/state/opencode:/home/user/.local/state/opencode
      - ~/.cache/opencode:/home/user/.cache/opencode
      - ~/.gitconfig:/home/user/.gitconfig:ro
    x-drun-layer:
      apk:
        - bash
        - curl
        - git
        - git-lfs
        - go
        - make
        - nodejs
        - npm
        - python3
        - uv

  pandoc:
    image: pandoc/extra:3.9-debian@sha256:a13da0f520e5b0d1d3d45b077982ca6233fe7aee6f69385e3ccff94f26e9fb89
    environment:
      HOME: /tmp

  python:
    image: python:3.14-alpine@sha256:5a824eb82cc75361f98611f3cfc5091ea33f10a6ccea4d4ebdabbc523b9a1614

  ripgrep:
    image: alpine:3.23@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    entrypoint: rg
    x-drun-layer:
      apk: [ripgrep]

  rclone:
    image: rclone/rclone:1.74.3@sha256:623378ad0ff3ebd5cebf77720843c0e02edfe46e2d5b5ac6bed54c6371780dfb
    volumes:
      - ~/.config/rclone:/config/rclone

  shellcheck:
    image: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

  terraform:
    image: hashicorp/terraform:1.15@sha256:15bf5a08b1fb9c9747c8ff01098aeeefb4aec9a6c24eb13e7661bdf9447e4aee

  updatecli:
    image: ghcr.io/updatecli/updatecli:v0.118.0@sha256:f5442c61c28948dc16c0520431c5e1263604ff06d795795c64066c48397f9793

  uv:
    image: ghcr.io/astral-sh/uv:0.11.19-python3.14-trixie@sha256:b5a5d154dba528e849e69e0fc47f0a3ee7373843bb117d84790952100b561a02

  yq:
    image: mikefarah/yq:4@sha256:11a1f0b604b13dbbdc662260d8db6f644b22d8553122a25c1b5b2e8713ca6977
