services:
  aws:
    image: amazon/aws-cli:2.34.53@sha256:cf53765c0de54ad3a8ea21818f1c4c845a8cf7ca87831c078a00fef244031493
    volumes:
      - ~/.aws:/root/.aws
    user: default

  claude:
    image: node:26-alpine@sha256:7c6af15abe4e3de859690e7db171d0d711bf37d27528eddfe625b2fe89e097f8
    entrypoint: claude
    environment:
      HOME: /home/user
      SHELL: /bin/bash
    volumes:
      - ~/.claude:/home/user/.claude
      - ~/.claude.json:/home/user/.claude.json
      - ~/.gitconfig:/home/user/.gitconfig:ro
    x-drun-layer:
      apk:
        - bash
        - curl
        - git
        - git-lfs
        - go
        - make
        - nodejs
        - npm
        - uv
      npm: ['@anthropic-ai/claude-code']

  codex:
    image: node:26-alpine@sha256:7c6af15abe4e3de859690e7db171d0d711bf37d27528eddfe625b2fe89e097f8
    entrypoint: codex
    environment:
      HOME: /home/user
    volumes:
      - ~/.codex:/home/user/.codex
      - ~/.gitconfig:/home/user/.gitconfig:ro
    x-drun-layer:
      apk:
        - bash
        - curl
        - git
        - git-lfs
        - go
        - make
        - nodejs
        - npm
        - uv
      npm: ['@openai/codex']

  dive:
    image: wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10
    user: default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  gdal:
    image: ghcr.io/osgeo/gdal:alpine-small-3.6.3@sha256:5acba2cc589839090cfe5e90a990c6383c883a3507102bcd8f9a842891a6f672

  go:
    image: golang:1.26-alpine@sha256:91eda9776261207ea25fd06b5b7fed8d397dd2c0a283e77f2ab6e91bfa71079d
    environment:
      GOPATH: /cwd/.go
      GOCACHE: /cwd/.go/cache

  jq:
    image: alpine:3.23@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    x-drun-layer:
      apk: [jq]

  mc:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    volumes:
      - ~/.mc:/.mc

  mitmproxy:
    image: mitmproxy/mitmproxy:12.2.3@sha256:00b77b5d8804c8ad18cb6caefbf9d5849e895e8986c5ce011f4ae30f4385962f
    entrypoint: mitmweb
    command: [--web-host, 0.0.0.0]
    ports: [2080:8080, 127.0.0.1:2081:8081]
    volumes:
      - ~/.mitmproxy:/home/mitmproxy/.mitmproxy
    user: default

  mtr:
    image: alpine:3.23@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    entrypoint: mtr
    x-drun-layer:
      apk: [mtr]

  node:
    image: node:26-alpine@sha256:7c6af15abe4e3de859690e7db171d0d711bf37d27528eddfe625b2fe89e097f8

  opencode:
    image: ghcr.io/anomalyco/opencode:1.14.48@sha256:27dbced5ab6a815631a620e55c49e74d826b399da37f044385453e28df1852ed
    environment:
      HOME: /home/user
    volumes:
      - ~/.config/opencode:/home/user/.config/opencode
      - ~/.local/share/opencode:/home/user/.local/share/opencode
      - ~/.local/state/opencode:/home/user/.local/state/opencode
      - ~/.cache/opencode:/home/user/.cache/opencode
      - ~/.gitconfig:/home/user/.gitconfig:ro
    x-drun-layer:
      apk: [git, git-lfs, nodejs, npm, uv, go, make, curl]

  pandoc:
    image: pandoc/extra:3.9-debian@sha256:a13da0f520e5b0d1d3d45b077982ca6233fe7aee6f69385e3ccff94f26e9fb89
    environment:
      HOME: /tmp

  python:
    image: python:3.14-alpine@sha256:5a824eb82cc75361f98611f3cfc5091ea33f10a6ccea4d4ebdabbc523b9a1614

  ripgrep:
    image: alpine:3.23@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    entrypoint: rg
    x-drun-layer:
      apk: [ripgrep]

  rclone:
    image: rclone/rclone:1.74.2@sha256:9ce0d49b611d3781233e25334e9e23d7af01e5546da7087f90d55f034ef13637
    volumes:
      - ~/.config/rclone:/config/rclone

  shellcheck:
    image: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

  terraform:
    image: hashicorp/terraform:1.15@sha256:bf33ffa0dc4777e911f6ab96feafd79be58036b2f74a9772d649818a780c3a13

  updatecli:
    image: ghcr.io/updatecli/updatecli:v0.117.0@sha256:3d15cfdc333862c0329c977d65195e659062d737222b676f1298ffab8d7a7412

  uv:
    image: ghcr.io/astral-sh/uv:0.11.16-python3.14-trixie@sha256:9c56cda4825e06df86b0fa03bfdd7060d2b4529682317ae2647c337df4fb23e7

  yq:
    image: mikefarah/yq:4@sha256:0cb4a78491b6e62ee8a9bf4fbeacbd15b5013d19bc420591b05383a696315e60
